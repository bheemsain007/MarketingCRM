# Flutter's generated default asks for -Xmx8G and a 4G metaspace, which is far
# more than this app needs and more than a developer machine running the CRM
# backend, a database and an emulator alongside can spare. The JVM refuses to
# start at all rather than using less, so the build fails outright with
# "insufficient memory for the Java Runtime Environment" instead of merely
# being slow - which is how this was found.
#
# 2G builds this project comfortably. Raise it only if a real build runs out,
# not pre-emptively.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
